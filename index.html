<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poftă — Restaurant Loyalty Platform</title>

    <meta name="description"
          content="Restaurant loyalty, QR campaigns, customer management and marketing automation.">

    <!-- LinkedIn / Open Graph -->
    <meta property="og:title" content="Poftă — Restaurant Loyalty Platform">
    <meta property="og:description"
          content="Restaurant loyalty, QR campaigns, customer management and marketing automation.">
    <meta property="og:type" content="website">
    <meta property="og:url"
          content="https://andrei-placinta.github.io/pofta-preview/">
    <meta property="og:image"
          content="https://andrei-placinta.github.io/pofta-preview/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta http-equiv="refresh"
          content="5;url=https://pofta.mypofta.workers.dev/">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        .page {
            position: relative;
            width: min(1200px, 100vw);
            height: min(630px, 100vh);
            min-height: 560px;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #faf9f5;
            border-radius: 44px;
        }

        /* Soft decorative shapes */
        .shape {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }

        .shape-top-left {
            width: 520px;
            height: 520px;
            top: -300px;
            left: -180px;

            background:
                radial-gradient(
                    circle at 60% 60%,
                    rgba(221, 235, 194, 0.55),
                    rgba(238, 242, 225, 0.35) 55%,
                    rgba(250, 249, 245, 0) 72%
                );
        }

        .shape-bottom-right {
            width: 500px;
            height: 500px;
            right: -220px;
            bottom: -320px;

            background:
                radial-gradient(
                    circle at 40% 40%,
                    rgba(226, 236, 202, 0.55),
                    rgba(241, 244, 229, 0.35) 58%,
                    rgba(250, 249, 245, 0) 74%
                );
        }

        /* Tiny dot patterns */
        .dots {
            position: absolute;
            width: 86px;
            height: 86px;
            opacity: 0.48;

            background-image: radial-gradient(
                circle,
                #a9bd86 2px,
                transparent 2.5px
            );
            background-size: 18px 18px;
        }

        .dots-top-right {
            top: 38px;
            right: 36px;
        }

        .dots-bottom-left {
            bottom: 38px;
            left: 36px;
        }

        .content {
            position: relative;
            z-index: 2;
            width: min(900px, 90%);
            text-align: center;
            transform: translateY(-5px);
        }

        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
            margin: 0 auto 18px;

            filter: drop-shadow(0 8px 16px rgba(22, 70, 37, 0.08));
        }

        h1 {
            margin: 0 0 18px;

            color: #0e2518;
            font-size: clamp(42px, 5vw, 64px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .description {
            max-width: 760px;
            margin: 0 auto 34px;

            color: #666866;
            font-size: clamp(18px, 2vw, 25px);
            line-height: 1.55;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 28px;

            min-width: 330px;
            height: 64px;
            padding: 0 30px;

            border-radius: 12px;
            background: #062d1b;
            color: #fff;

            text-decoration: none;
            font-size: 20px;
            font-weight: 500;

            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #0a3b24;
        }

        .arrow {
            font-size: 28px;
            line-height: 1;
            font-weight: 300;
        }

        .redirect {
            margin-top: 25px;
            color: #777a76;
            font-size: 14px;
        }

        .progress {
            width: 62px;
            height: 4px;
            margin: 10px auto 0;
            border-radius: 99px;
            background: #a6c78b;
        }

        @media (max-width: 700px) {
            .page {
                width: 100vw;
                height: 100vh;
                min-height: 500px;
                border-radius: 0;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .description {
                max-width: 90%;
                font-size: 17px;
            }

            .button {
                min-width: 260px;
                height: 56px;
                font-size: 17px;
            }

            .dots {
                opacity: 0.25;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <div class="shape shape-top-left"></div>
        <div class="shape shape-bottom-right"></div>

        <div class="dots dots-top-right"></div>
        <div class="dots dots-bottom-left"></div>

        <section class="content">

            <img
                class="logo"
                src="pofta-logo.png"
                alt="Poftă logo"
            >

            <h1>Poftă</h1>

            <p class="description">
                Restaurant loyalty, QR campaigns,<br>
                customer management and marketing automation.
            </p>

            <a
                class="button"
                href="https://pofta.mypofta.workers.dev/"
            >
                Visit Poftă
                <span class="arrow">→</span>
            </a>

            <div class="redirect">
                You will be redirected in a few seconds
                <div class="progress"></div>
            </div>

        </section>
    </main>
</body>
</html>
